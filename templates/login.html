{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="clinical-card">
            <span class="section-number">CLINICAL ACCESS</span>
            <h2 class="mb-4">Log In</h2>
            
            <!-- Flash messages for errors -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} rounded-0">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                
                <div class="form-check mb-4">
                    <input class="form-check-input rounded-0" type="checkbox" id="habeasData" required>
                    <label class="form-check-label small text-muted" for="habeasData">
                        I authorize the processing of my personal data in accordance with Law 1581 of 2012.
                    </label>
                </div>

                <button type="submit" class="btn btn-custom w-100">Enter System</button>
            </form>
            
            <div class="text-center mt-4">
                <p class="small text-muted">Don't have an account? <a href="/register" style="color: var(--primary-teal);">Create one</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
